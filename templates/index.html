<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>🎓 EduGenie</h1>
            <p>AI Learning Assistant</p>
        </div>
    </header>

    <main class="container">

        <section class="hero">
            <h2>Learn Smarter with AI 🤖</h2>
            <p>
                Ask questions, understand concepts, create quizzes,
                summarize notes and build your learning path.
            </p>
        </section>

        <section class="card">

            <label for="task">Choose a Learning Task</label>

            <select id="task">
                <option value="qa">Question & Answer</option>
                <option value="explain">Explain a Concept</option>
                <option value="quiz">Generate Quiz</option>
                <option value="summarize">Summarize Text</option>
                <option value="learn">Learning Path</option>
            </select>

            <label for="inputText">Enter your question / topic / text</label>

            <textarea
                id="inputText"
                rows="8"
                placeholder="Type your question here..."
            ></textarea>

            <div id="quizOptions" class="hidden">

                <label for="difficulty">Difficulty</label>

                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <label for="questionCount">Number of Questions</label>

                <select id="questionCount">
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                </select>

            </div>

            <div id="learningOptions" class="hidden">

                <label for="level">Learning Level</label>

                <select id="level">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>

                <label for="weeks">Number of Weeks</label>

                <select id="weeks">
                    <option value="2">2</option>
                    <option value="4" selected>4</option>
                    <option value="8">8</option>
                    <option value="12">12</option>
                </select>

            </div>

            <button id="submitBtn">
                🚀 Generate
            </button>

        </section>

        <section class="card result-card">

            <div class="result-header">
                <h2>Result</h2>

                <div>
                    <button id="copyBtn" class="secondary-btn">
                        Copy
                    </button>

                    <button id="clearBtn" class="secondary-btn">
                        Clear
                    </button>
                </div>
            </div>

            <div id="loading" class="hidden">
                <p>🤖 EduGenie is thinking...</p>
            </div>

            <div id="result">
                <p class="placeholder">
                    Your AI-generated answer will appear here.
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>EduGenie © 2026 | AI Learning Assistant</p>
    </footer>

    <script src="/static/css/js/app.js"></script>

</body>
</html>
